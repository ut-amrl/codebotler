<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Commands</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/themes/prism.min.css">
    <style>
      body {
          background-color: white;
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          position: relative;
      }


      .caption {
          color: #888;
          font-size: 2.1rem;
          margin-bottom: 3.5rem;
          margin-top: 8rem;
      }

      .textbox-container {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          border-radius: 8px;
          overflow: hidden;
          resize: none;
          border: 1px solid #ccc;
          margin-bottom: 1rem;
      }
      .transcription-container {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          border-radius: 8px;
          overflow: hidden;
          resize: none;
          border: 1px solid #ccc;
          margin-bottom: 1rem;
          background-color: #fafafa;
      }

      .speech {
          text-wrap: wrap;
          color: lightgrey;
      }

      textarea {
          display: block;
          width: 100%;
          height: 16px;
          padding: 0.5rem;
          font-size: 1rem;
          line-height: 1;
          border: none;
          outline: none;
          resize: none;
          overflow: hidden;
          /* max-height: 3em; */
      }

      .status-box {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          border-radius: 8px;
          border: 0px solid #ccc;
          color: rgb(166, 166, 166);
          font-size: 1rem;
          line-height: 1.5;
          position: relative;
          top: 30px;
          white-space: pre-wrap;
          overflow-y: auto;
          max-height: 4.5em;
          padding-top: 0em;
          padding-bottom: 0em;
      }

      .code-pane {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          background-color: #f5f5f5;
          border-radius: 8px;
          border: 1px solid #ccc;
          overflow-y: auto;
          font-size: 1rem;
          line-height: 1.5;
          max-height: 30em;
      }

      .button-container-execute {
          width: 100%;
          max-width: 500px;
          display: flex;
          justify-content: space-between;
          margin: 1rem 0;
          align-items: center;
      }

      .button-container {
          width: 100%;
          max-width: 800px;
          display: flex;
          justify-content: space-between;
          margin: 1rem 0 0;
          align-items: center;
      }

      .button {
          padding: 0.5rem 1rem;
          font-size: 1rem;
          line-height: 1.5;
          border-radius: 8px;
          border: 1px solid #ccc;
          background-color: white;
          cursor: pointer;
          min-width: 150px;
      }

      .button:hover {
          background-color: #f5f5f5;
      }

      .highlight-function {
        color: #bf6c00; /* this will make "my_func" appear in orange color */
      }
    </style>
</head>
<body>
    <div class="caption" id="captionfeedback">What would you like the robot to do?</div>
    <div class="textbox-container">
        <textarea id="taskPrompt" rows="1" placeholder="Example: Go to every room and say 'Hello, World!'" oninput="autoGrow(this)"></textarea>
    </div>
    <div class="transcription-container">
        <pre><code id="transcription" class="speech"></code></pre>
    </div>
    <div class="code-pane">
        <pre><code id="code" class="language-python">
        </code></pre>
    </div>
    <div class="button-container-execute">
      <button class="button" id="generateCode">Generate Code</button>
      <button class="button" id="executeCode">Execute!</button>
    </div>

    <pre class="status-box" id="status-box"></pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/components/prism-python.min.js"></script>
    <script>
        const SERVER_URL = 'ws://localhost:8190';

        function autoGrow(textarea) {
          textarea.style.height = 'auto';
          const prevScrollHeight = textarea.scrollHeight;
          textarea.style.height = (prevScrollHeight - 16) + 'px';
        }

        function executeCode(socket) {
          setStatus("Executing previous program.");
          try {
            setStatus("Sending program for execution...");
            executeData = {
                "type": "execute",
                "task": document.getElementById("taskPrompt").value,
                "code": document.getElementById("code").textContent
            };
            socket.send(JSON.stringify(executeData));
          } catch (error) {
            setStatus("Error connecting to server.");
          }
        }

        function setStatus(str) {
            statusBox = document.getElementById("status-box");
            statusBox.textContent += "\n" + str;
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        function doSyntaxHighlighting() {
          let codeElement = document.getElementById("code");
          Prism.highlightElement(codeElement);
          // Then post-process to highlight specific function name
          // let codeElement = document.querySelector('.code-pane pre code');
          let codeHTML = codeElement.innerHTML;
          codeHTML = codeHTML.replace(/\b(get_all_rooms|get_current_location|go_to|is_in_room|say|ask|pick|place)\b/g, '<span class="highlight-function">$&</span>');
          codeElement.innerHTML = codeHTML;
        }

        function highlightInstruction(element, instruction) {
          textString = element.innerHTML;
          textString = textString.replace(instruction, '<span style="color:black; font-weight: bold;">'+instruction+'</span>');
          element.innerHTML = textString;
        }

        function updateCodeBlock(response) {
          setStatus("Code generated in " + response.timing + " seconds.");
          let codeElement = document.getElementById("code");
          if (codeElement.textContent.startsWith("\n")) {
              codeElement.textContent = codeElement.textContent.slice(1);
          }
          codeElement.textContent = response.code;
          doSyntaxHighlighting();
          let captionElement = document.getElementById("captionfeedback");
          captionElement.textContent = "Say \"Yes, execute please.\" to execute the generated code.";
        }

        function updateTranscript(response) {
          let transcriptElement = document.getElementById("transcription");
          let suffixLength = response.transcript.length;
          let prefixLength = transcriptElement.textContent.length;
          let maxLength = 1000;
          if (prefixLength + suffixLength > maxLength) {
              if (suffixLength >= maxLength) {
                  transcriptElement.textContent = response.transcript.slice(-maxLength);
              } else {
                  transcriptElement.textContent = transcriptElement.textContent.slice(-(maxLength-suffixLength))
                  + response.transcript;
              }
          } else {
              transcriptElement.textContent = transcriptElement.textContent + response.transcript;
          }
          if (response.hasOwnProperty('instruction')) {
            highlightInstruction(transcriptElement, response.instruction);
          }
          if (response.hasOwnProperty('doexecute')) {
            // Just update a status message here.
            setStatus("Executing previous program.");
            setStatus("Sending program for execution...");
          }
        }
        function displayTranscripts(event) {
          let response = JSON.parse(event.data);
          if (response.hasOwnProperty('transcript')) {
            updateTranscript(response);
          }
          if (response.hasOwnProperty('code')) {
            updateCodeBlock(response);
          }
        }

        function openWebSocket() {
            let socket = new WebSocket(SERVER_URL);
            try {
              setStatus("Connecting to server...");
              socket.onopen = function(event) {
                  setStatus("Connected to server. Streaming instructions...");
              };
              socket.onmessage = displayTranscripts;
              socket.onerror = function(error) {
                  setStatus("Websocket error.");
              };

              socket.onclose = function(event) {
                  setStatus("Connection closed.");
              };
            } catch (error) {
              setStatus("Error connecting to server.");
            }
            return socket;
        }
        
        function generateCodeRequest(socket, text, execute) {
            try {
              setStatus("Sending Request to Server... Generating code...");
              socket.send(JSON.stringify(
                { "type": "code", "prompt": text, "execute": execute }
              ));
            } catch (error) {
              setStatus("Error connecting to server.");
            }

        }
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementById("code").textContent =
`def task_program():
    list_of_rooms = get_all_rooms()
    start_loc = get_current_location()
    for room in list_of_rooms:
        go_to(room)
        say("Hello, world!")
    go_to(start_loc)`;
          doSyntaxHighlighting();
          const ws = openWebSocket();

          const genButton = document.getElementById("generateCode");
          const execButton = document.getElementById("executeCode");
          const taskBox = document.getElementById("taskPrompt");

          genButton.addEventListener("click", function() {
            taskDescription = taskBox.value;
            generateCodeRequest(ws, taskDescription, false);
          });
          execButton.addEventListener("click", function() {
            executeCode(ws);
          });
          taskBox.addEventListener("keydown", function(event) {
              if (event.keyCode === 13 && !event.shiftKey) {
                event.preventDefault();
                taskDescription = taskBox.value;
                generateCodeRequest(ws, taskDescription, true);
              }
          });

        }, false);

</script>
</body>
</html>
