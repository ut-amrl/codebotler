<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Commands</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/themes/prism.min.css">
    <style>
      body {
          background-color: white;
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          position: relative;
      }


      .caption {
          color: #888;
          font-size: 2.1rem;
          margin-bottom: 3.5rem;
          margin-top: 8rem;
      }

      .textbox-container {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          border-radius: 8px;
          overflow: hidden;
          resize: none;
          border: 1px solid #ccc;
          margin-bottom: 1rem;
      }
      textarea {
          display: block;
          width: 100%;
          height: 16px;
          padding: 0.5rem;
          font-size: 1rem;
          line-height: 1;
          border: none;
          outline: none;
          resize: none;
          overflow: hidden;
          /* max-height: 3em; */
      }

	      .status-box {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          border-radius: 8px;
          border: 0px solid #ccc;
          color: rgb(166, 166, 166);
          font-size: 1rem;
          line-height: 1.5;
          position: relative;
          top: 30px;
          white-space: pre-wrap;
          overflow-y: auto;
          max-height: 4.5em;
          padding-top: 0em;
	          padding-bottom: 0em;
	      }

	      .action-status {
	          width: 100%;
	          max-width: 800px;
	          display: grid;
	          grid-template-columns: 1fr 220px;
	          gap: 0.75rem;
	          margin: 0.25rem 0 0.75rem;
	          padding: 0.75rem 1rem;
	          border: 1px solid #ccc;
	          border-radius: 8px;
	          background-color: #fbfbfb;
	          box-sizing: border-box;
	      }

	      .action-status-label {
	          color: #777;
	          font-size: 0.8rem;
	          margin-bottom: 0.25rem;
	      }

	      .action-status-value {
	          color: #222;
	          font-family: monospace;
	          font-size: 0.95rem;
	          min-height: 1.2rem;
	          overflow-wrap: anywhere;
	      }

	      .action-status-detail {
	          grid-column: 1 / -1;
	          color: #777;
	          font-size: 0.85rem;
	          min-height: 1rem;
	      }

      .code-pane {
          width: 100%;
          max-width: 800px;
          padding: 1rem;
          background-color: #f5f5f5;
          border-radius: 8px;
          border: 1px solid #ccc;
          overflow-y: auto;
          font-size: 1rem;
          line-height: 1.5;
          max-height: 30em;
      }

      .button-container-execute {
          width: 100%;
          max-width: 500px;
          display: flex;
          justify-content: space-between;
          margin: 1rem 0;
          align-items: center;
      }

      .button-container {
          width: 100%;
          max-width: 800px;
          display: flex;
          justify-content: space-between;
          margin: 1rem 0 0;
          align-items: center;
      }

      .button {
          padding: 0.5rem 1rem;
          font-size: 1rem;
          line-height: 1.5;
          border-radius: 8px;
          border: 1px solid #ccc;
          background-color: white;
          cursor: pointer;
          min-width: 150px;
      }

      .button:hover {
          background-color: #f5f5f5;
      }

      .highlight-function {
        color: #bf6c00; /* this will make "my_func" appear in orange color */
      }
    </style>
</head>
<body>
    <div class="caption" id="captionfeedback">What would you like the robot to do?</div>
    <div class="textbox-container">
        <textarea id="taskPrompt" rows="1" placeholder="Example: Go to every room and say 'Hello, World!'" oninput="autoGrow(this)"></textarea>
    </div>
    <div class="code-pane">
        <pre><code id="code" class="language-python">
        </code></pre>
    </div>
	    <div class="button-container-execute">
	      <button class="button" id="generateCode">Generate Code</button>
	      <button class="button" id="executeCode">Execute!</button>
	    </div>

	    <div class="action-status">
	      <div>
	        <div class="action-status-label">Current DSL call</div>
	        <div class="action-status-value" id="currentDslCall">None</div>
	      </div>
	      <div>
	        <div class="action-status-label">ROS status</div>
	        <div class="action-status-value" id="currentDslStatus">IDLE</div>
	      </div>
	      <div class="action-status-detail" id="currentDslDetail"></div>
	    </div>

	    <pre class="status-box" id="status-box"></pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/components/prism-python.min.js"></script>
    <script>
	        const SERVER_URL = 'ws://localhost:8190';
	        let generatedCode = "";

        function autoGrow(textarea) {
          textarea.style.height = 'auto';
          const prevScrollHeight = textarea.scrollHeight;
          textarea.style.height = (prevScrollHeight - 16) + 'px';
        }

	        function executeCode(socket) {
	          if (!generatedCode.trim()) {
	            setStatus("No generated code to execute.");
	            return;
	          }
	          if (socket.readyState !== WebSocket.OPEN) {
	            setStatus("Websocket is not connected.");
	            return;
	          }
	          setStatus("Executing generated program.");
	          try {
	            setStatus("Sending program for execution...");
	            const executeData = {
	                "type": "execute",
	                "code": generatedCode
	            };
	            socket.send(JSON.stringify(executeData));
          } catch (error) {
            setStatus("Error connecting to server.");
          }
        }

	        function setStatus(str) {
	            const statusBox = document.getElementById("status-box");
	            statusBox.textContent += "\n" + str;
	            statusBox.scrollTop = statusBox.scrollHeight;
	        }

	        function setActionStatus(payload) {
	          const callElement = document.getElementById("currentDslCall");
	          const statusElement = document.getElementById("currentDslStatus");
	          const detailElement = document.getElementById("currentDslDetail");
	          callElement.textContent = payload.call || "None";
	          statusElement.textContent = payload.status || "IDLE";
	          const detail = payload.detail || "";
	          const timestamp = payload.timestamp ? new Date(payload.timestamp * 1000).toLocaleTimeString() : "";
	          detailElement.textContent = timestamp ? `${detail} Last update: ${timestamp}` : detail;
	        }

        function doSyntaxHighlighting() {
          let codeElement = document.getElementById("code");
          Prism.highlightElement(codeElement);
          // Then post-process to highlight specific function name
          // let codeElement = document.querySelector('.code-pane pre code');
          let codeHTML = codeElement.innerHTML;
          codeHTML = codeHTML.replace(/\b(get_all_rooms|get_current_location|go_to|is_in_room|say|ask|pick|place)\b/g, '<span class="highlight-function">$&</span>');
          codeElement.innerHTML = codeHTML;
        }

	        function updateCodeBlock(response) {
	          setStatus("Code generated in " + response.timing + " seconds.");
	          let codeElement = document.getElementById("code");
          if (codeElement.textContent.startsWith("\n")) {
              codeElement.textContent = codeElement.textContent.slice(1);
	          }
	          codeElement.textContent = response.code;
	          generatedCode = response.code || "";
	          doSyntaxHighlighting();
	          const captionElement = document.getElementById("captionfeedback");
          captionElement.textContent = "Generated code is ready to execute.";
        }

	        function handleServerMessage(event) {
	          let response = JSON.parse(event.data);
	          if (response.type === "action_status" && response.hasOwnProperty("action_status")) {
	            setActionStatus(response.action_status);
	            return;
	          }
          if (response.hasOwnProperty('code')) {
            updateCodeBlock(response);
          }
        }

        function openWebSocket() {
            let socket = new WebSocket(SERVER_URL);
            try {
              setStatus("Connecting to server...");
              socket.onopen = function(event) {
                  setStatus("Connected to server.");
              };
              socket.onmessage = handleServerMessage;
              socket.onerror = function(error) {
                  setStatus("Websocket error.");
              };

              socket.onclose = function(event) {
                  setStatus("Connection closed.");
              };
            } catch (error) {
              setStatus("Error connecting to server.");
            }
            return socket;
        }
        
	        function generateCodeRequest(socket, text) {
	            try {
	              if (socket.readyState !== WebSocket.OPEN) {
	                setStatus("Websocket is not connected.");
	                return;
	              }
	              setStatus("Sending Request to Server... Generating code...");
	              socket.send(JSON.stringify(
	                { "type": "code", "prompt": text }
	              ));
            } catch (error) {
              setStatus("Error connecting to server.");
            }

	        }
	        document.addEventListener('DOMContentLoaded', function() {
	          document.getElementById("code").textContent = "";
	          doSyntaxHighlighting();
          const ws = openWebSocket();

          const genButton = document.getElementById("generateCode");
          const execButton = document.getElementById("executeCode");
          const taskBox = document.getElementById("taskPrompt");

	          genButton.addEventListener("click", function() {
		            const taskDescription = taskBox.value;
	            generatedCode = "";
	            document.getElementById("code").textContent = "";
	            setActionStatus({call: "None", status: "IDLE", detail: ""});
	            generateCodeRequest(ws, taskDescription);
	          });
          execButton.addEventListener("click", function() {
            executeCode(ws);
          });
          taskBox.addEventListener("keydown", function(event) {
	              if (event.key === "Enter" && !event.shiftKey) {
		                event.preventDefault();
		                const taskDescription = taskBox.value;
	                generatedCode = "";
	                document.getElementById("code").textContent = "";
	                setActionStatus({call: "None", status: "IDLE", detail: ""});
	                generateCodeRequest(ws, taskDescription);
	              }
	          });

        }, false);

</script>
</body>
</html>
